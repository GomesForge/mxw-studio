      <stop offset=".47" stop-color="#1E2537"/>
      <stop offset=".71" stop-color="#090D18"/>
      <stop offset=".88" stop-color="#070A13"/>
      <stop offset="1" stop-color="#25334D"/>
    </radialGradient>
    <radialGradient id="bomb3d-rim">
