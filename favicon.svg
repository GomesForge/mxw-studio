<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="bomb3d-title bomb3d-desc">
  <title id="bomb3d-title">Bomba cartoon com efeito 3D</title>
  <desc id="bomb3d-desc">Bomba esférica preta e brilhante, com reflexos azuis, bocal dourado, pavio trançado e faísca laranja. Fundo transparente.</desc>
